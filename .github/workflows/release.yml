name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s host -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go build -o bin/anker ./cmd/anker
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm test --prefix web
      - name: Real systemd installation and recovery
        run: |
          go test -c ./internal/updater -o bin/updater-systemd.test
          go build -ldflags='-X anker/internal/buildinfo.Version=v0.2.1' -o bin/anker-systemd-candidate ./cmd/anker
          sudo env GITHUB_ACTIONS=true ./scripts/test-systemd.sh "$PWD/bin/anker" "$PWD/bin/updater-systemd.test" "$PWD/bin/anker-systemd-candidate"
      - name: Build and sign packages
        env:
          ANKER_VERSION: ${{ github.ref_name }}
          ANKER_SIGNING_KEY: ${{ secrets.ANKER_SIGNING_KEY }}
        run: scripts/build-release.sh "$ANKER_VERSION"
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          ANKER_VERSION: ${{ github.ref_name }}
        run: gh release create "$ANKER_VERSION" dist/anker-* dist/public.* dist/release.json dist/release.json.sig dist/SHA256SUMS --verify-tag --draft --title "Anker $ANKER_VERSION" --notes-file CHANGELOG.md
