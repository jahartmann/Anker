name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s host -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s docs/recovery-lab -p 'test_*.py'
      - run: go build -o bin/anker ./cmd/anker
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm test --prefix web
      - name: Real systemd installation and recovery
        run: |
          go test -c ./internal/updater -o bin/updater-systemd.test
          go build -ldflags='-X anker/internal/buildinfo.Version=v0.2.1' -o bin/anker-systemd-candidate ./cmd/anker
          sudo env GITHUB_ACTIONS=true ./scripts/test-systemd.sh "$PWD/bin/anker" "$PWD/bin/updater-systemd.test" "$PWD/bin/anker-systemd-candidate"
      - name: Build and sign packages
        env:
          ANKER_VERSION: ${{ github.ref_name }}
          ANKER_SIGNING_KEY: ${{ secrets.ANKER_SIGNING_KEY }}
        run: scripts/build-release.sh "$ANKER_VERSION"
      - name: Verify signed packages and start release binary
        env:
          ANKER_VERSION: ${{ github.ref_name }}
        run: |
          cd dist
          ../scripts/verify-release.sh ../public.pem anker-linux-amd64.tar.gz
          ../scripts/verify-release.sh ../public.pem anker-linux-arm64.tar.gz
          python3 - <<'PY'
          import hashlib, http.cookiejar, json, os, pathlib, subprocess, tempfile, time, urllib.request
          manifest = json.loads(pathlib.Path('release.json').read_text())
          assert manifest['version'] == os.environ['ANKER_VERSION']
          assert len(manifest['assets']) == 4
          for asset in manifest['assets']:
              path = pathlib.Path(asset['name'])
              assert path.name == str(path), 'Unexpected artifact path'
              assert path.stat().st_size == asset['size']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == asset['sha256']
          binary = pathlib.Path('anker-linux-amd64').resolve()
          assert subprocess.check_output([str(binary), 'version'], text=True).strip() == 'Anker ' + manifest['version']
          with tempfile.TemporaryDirectory(prefix='anker-release-smoke-') as directory:
              process = subprocess.Popen([str(binary), '--data', directory, '--listen', '127.0.0.1:8092', 'demo'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              try:
                  opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
                  for attempt in range(100):
                      assert process.poll() is None, 'Release binary exited during startup'
                      try:
                          with opener.open('http://127.0.0.1:8092/', timeout=1) as response:
                              assert response.status == 200
                          break
                      except OSError:
                          time.sleep(0.2)
                  else:
                      raise AssertionError('Release did not become ready')
                  login = urllib.request.Request('http://127.0.0.1:8092/api/login', data=json.dumps({'name': 'demo', 'password': 'anker-demo-2026'}).encode(), headers={'Content-Type': 'application/json', 'X-Anker-Request': '1'})
                  with opener.open(login, timeout=5) as response:
                      assert response.status == 200
                  with opener.open('http://127.0.0.1:8092/api/status', timeout=5) as response:
                      status = json.load(response)
                  assert status['demo'] is True and len(status['hosts']) == 6
                  print('Signed release artifacts verified; exact Linux release binary starts and serves authenticated demo data.')
              finally:
                  process.terminate()
                  try:
                      process.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
          PY
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          ANKER_VERSION: ${{ github.ref_name }}
        run: gh release create "$ANKER_VERSION" dist/anker-* dist/public.* dist/release.json dist/release.json.sig dist/SHA256SUMS --verify-tag --draft --title "Anker $ANKER_VERSION" --notes-file "docs/releases/$ANKER_VERSION.md"
